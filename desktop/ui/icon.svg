<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="snapcut">
  <rect width="64" height="64" rx="14" fill="#1D5A39"/>
  <g fill="none" stroke="#F3F5EF" stroke-linecap="round">
    <!-- ball -->
    <path d="M7 36 C16 20 46 20 55 36 C46 52 16 52 7 36 Z" stroke-width="3.6" stroke-linejoin="round"/>
    <!-- end stripes -->
    <path d="M17 26.5 C15.8 31 15.8 41 17 45.5" stroke-width="3"/>
    <path d="M45 26.5 C46.2 31 46.2 41 45 45.5" stroke-width="3"/>
    <!-- cut line where the laces go -->
    <path d="M21.5 36 H38" stroke-width="3.2" stroke-linecap="butt" stroke-dasharray="3.4 2.4"/>
  </g>
  <!-- scissors, open, jaws straddling the end of the cut line -->
  <g stroke="#F2D40C" stroke-linecap="round" fill="none">
    <path d="M48.9 21.2 L44.5 29.5 L39.9 39" stroke-width="3.2"/>
    <path d="M53.2 28.6 L44.5 29.5 L35.8 30.6" stroke-width="3.2"/>
    <circle cx="50.8" cy="17.4" r="4" stroke-width="2.8"/>
    <circle cx="57.2" cy="28" r="4" stroke-width="2.8"/>
  </g>
  <circle cx="44.5" cy="29.5" r="1.3" fill="#1D5A39"/>
</svg>
