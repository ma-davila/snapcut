[package]
name = "snapcut-desktop"
version = "0.1.0"
description = "Snapcut desktop app"
license = "GPL-3.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-autostart = "2.6"
tauri-plugin-notification = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2"
serde_json = "1"
ureq = { version = "3", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
