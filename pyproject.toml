[project]
name = "snapcut"
version = "0.1.0"
description = "Spoiler-free American football highlights, cut down to live plays only"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
snapcut = "snapcut.server:main"
snapcut-cut = "snapcut.cli:main"
snapcut-publish = "snapcut.publish:main"
snapcut-agent = "snapcut.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
desktop = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pillow>=12.3.0",
    "playwright>=1.63.0",
]
