<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nflcut</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Opening: the scissors cut the line, then the screen splits along it. -->
<div id="intro" aria-hidden="true" hidden>
  <div class="half top"></div>
  <div class="half bottom"></div>
  <div class="seam"></div>
</div>
<template id="intro-mark">
  <svg class="mark" viewBox="0 0 64 64">
    <defs>
      <clipPath id="cut-reveal"><rect class="reveal" x="21.5" y="30" width="16.5" height="12"/></clipPath>
    </defs>
    <g fill="none" stroke="#F3F5EF" stroke-linecap="round">
      <path class="ball" pathLength="1" d="M7 36 C16 20 46 20 55 36 C46 52 16 52 7 36 Z" stroke-width="3.6" stroke-linejoin="round"/>
      <path class="stripe" d="M17 26.5 C15.8 31 15.8 41 17 45.5" stroke-width="3"/>
      <path class="stripe" d="M45 26.5 C46.2 31 46.2 41 45 45.5" stroke-width="3"/>
      <path clip-path="url(#cut-reveal)" d="M21.5 36 H38" stroke-width="3.2" stroke-linecap="butt" stroke-dasharray="3.4 2.4"/>
    </g>
    <g class="scissors" stroke="#F2D40C" stroke-linecap="round" fill="none">
      <g class="blade a">
        <path d="M48.9 21.2 L44.5 29.5 L39.9 39" stroke-width="3.2"/>
        <circle cx="50.8" cy="17.4" r="4" stroke-width="2.8"/>
      </g>
      <g class="blade b">
        <path d="M53.2 28.6 L44.5 29.5 L35.8 30.6" stroke-width="3.2"/>
        <circle cx="57.2" cy="28" r="4" stroke-width="2.8"/>
      </g>
      <circle cx="44.5" cy="29.5" r="1.3" fill="#1D5A39" stroke="none"/>
    </g>
  </svg>
</template>
<header class="top">
  <span class="brand"><img src="icon.svg" alt="" width="36" height="36">nflcut</span>
  <nav class="week-nav" aria-label="Semana">
    <button id="prev" class="arrow" aria-label="Semana anterior">‹</button>
    <h1 id="week-title">Cargando…</h1>
    <button id="next" class="arrow" aria-label="Semana siguiente">›</button>
  </nav>
</header>

<main id="days" aria-live="polite"></main>

<dialog id="player" aria-labelledby="player-title">
  <div class="frame" tabindex="-1" autofocus>
    <video id="video" playsinline preload="auto"></video>
    <div class="hud">
      <div class="hud-top">
        <div class="heading">
          <span id="p-count" class="count"></span>
          <h2 id="player-title"></h2>
        </div>
        <button id="p-close" class="icon" type="button" aria-label="Cerrar (Esc)">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="hud-bottom">
        <div id="timeline" role="slider" tabindex="0" aria-label="Posición" aria-valuemin="0">
          <div class="segs"></div>
          <div class="head"></div>
          <div class="tip" hidden></div>
        </div>
        <div class="controls">
          <span id="p-time" class="time">0:00 / 0:00</span>
          <div class="transport">
            <button id="p-prev" class="icon" type="button" aria-label="Jugada anterior (←)">
              <svg viewBox="0 0 24 24"><path d="M6 5v14"/><path class="fill" d="M19 5.5v13L9 12z"/></svg>
            </button>
            <button id="p-play" class="icon big" type="button" aria-label="Reproducir (espacio)">
              <svg class="i-play" viewBox="0 0 24 24"><path class="fill" d="M7 4.5v15L19.5 12z"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
            </button>
            <button id="p-next" class="icon" type="button" aria-label="Jugada siguiente (→)">
              <svg viewBox="0 0 24 24"><path d="M18 5v14"/><path class="fill" d="M5 5.5v13L15 12z"/></svg>
            </button>
          </div>
          <div class="side">
            <div class="volume">
              <button id="p-mute" class="icon" type="button" aria-label="Silenciar (M)">
                <svg viewBox="0 0 24 24"><path class="fill" d="M4 9h4l5-4v14l-5-4H4z"/><path class="i-wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="i-x" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>
              </button>
              <input id="p-vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volumen">
            </div>
            <button id="p-full" class="icon" type="button" aria-label="Pantalla completa (F)">
              <svg viewBox="0 0 24 24"><path class="i-enter" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><path class="i-exit" d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</dialog>

<template id="card-tpl">
  <article class="card">
    <div class="meta">
      <span class="kick"></span>
      <span class="net"></span>
    </div>
    <div class="teams">
      <div class="team away"><span class="swatch"></span><span class="abbr"></span><span class="name"></span><span class="score"></span></div>
      <div class="team home"><span class="swatch"></span><span class="abbr"></span><span class="name"></span><span class="score"></span></div>
      <button class="shutter" type="button">Ver resultado</button>
      <p class="detail"></p>
    </div>
    <div class="action"></div>
  </article>
</template>

<script src="intro.js"></script>
<script src="app.js"></script>
</body>
</html>
